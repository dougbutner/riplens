# RipLens — edit this, not the code, for most sessions.
# HSV and effect recipes live in skills/glitch-visualizer/SKILL.md.
# If you change mapping math in riplens/, update that skill in the same commit.

sources:
  music: sources/music
  images: sources/images
  videos: sources/videos

output:
  root: output
  ratios:
    1x1:  { width: 1080, height: 1080 }
    16x9: { width: 1920, height: 1080 }
    9x16: { width: 1080, height: 1920 }

fps: 30
threshold: 0.62
cooldown: 1.2
ken_burns: 0.08

hsv:
  hue_from: centroid
  sat_from: mid
  val_from: rms

effects:
  - kaleidoscope
  - chromatic
  - scanline
  - pixel_sort
  - block_corrupt
  - fractal
  - hsv_geometry
  - blend
  - lens_peel
  - feedback
  - vortex
  - slice_scramble
  - vhs
  - wave_warp
  - neon_edge
  - fisheye
  - zoom_streak
  - mosaic
  - solids
  - flower
  - metatron
  - merkaba
  - rgb_prism

overlays:
  solids: false
  glyphs: true

# Off by default. `riplens lyrics` writes sources/lyrics/<stem>.srt
# (edit that file, then render with --subs). Font names resolve inside fonts/.
subtitles:
  enabled: false
  file: auto
  font: Montserrat-ExtraBold
  size: 0.052
  position: bottom
  margin: 0.09

codec:
  video: auto          # auto | h264_nvenc | libx264
  crf: 18
  audio_bitrate: 192k
  preset: fast
